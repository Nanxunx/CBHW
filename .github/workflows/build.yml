name: Turtle335Converter CI

on:
  push:
    branches:
      - main
      - feature/*

  pull_request:
    branches:
      - main


jobs:

  build-windows:

    name: Windows MSVC Build

    runs-on: windows-2022


    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build-ci
          ~/.cache
        key: windows-cmake-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
        restore-keys: |
          windows-cmake-


    - name: Configure CMake
      run: |
        cmake -S . -B build-ci


    - name: Build Debug
      run: |
        cmake --build build-ci --config Debug


    - name: Run Tests
      run: |
        ctest --test-dir build-ci -C Debug --output-on-failure